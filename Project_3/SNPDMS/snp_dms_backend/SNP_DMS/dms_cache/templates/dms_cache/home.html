<!DOCTYPE html>
<html>
  <head>
    <title>Redis Keys</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">

    <style>
      table {
        border-collapse: collapse;
        width: 100%;
      }
      th, td {
        border: 1px solid #000;
        padding: 8px;
        text-align: left;
      }
      th {
        background-color: #f2f2f2;
      }
    </style>
  </head>
  <body>
    <h1>REDIS KEYS</h1>

    <table>
      <tr>
        <th>Keys</th>
        <th>Action</th>
      </tr>
      {% for key,value in all_keys.items %}
      <tr>
        <td><a href="{% url 'display_value' key %}" style="text-decoration: none">{{ key }}</a></td>
        <td><a href="{% url 'delete_keys' key %}" style="text-decoration: none"><i class="fas fa-trash"></i></a></td>
      </tr>
      {% endfor %}
    </table>
  </body>
</html>
